<template>
    <lightning-card title="Expense Tracker">
        <div class="slds-p-around_medium">
            <lightning-input name="Name" label="Expense Name" required onchange={handleChange}></lightning-input>
            <lightning-input label="Amount" name="Amount__c" type="number" required onchange={handleChange}></lightning-input>
            <lightning-combobox  label="Category" name="Category__c"  options={categoryOptions} onchange={handleChange}></lightning-combobox>
            <lightning-input label="Date" type="date" name="Expense_Date__c" onchange={handleChange}></lightning-input>
            <lightning-textarea label="Notes" name="Notes__c" onchange={handleChange}></lightning-textarea>

            <lightning-button class="saveButton" label="Save" variant="brand" onclick={saveExpense}></lightning-button>
        </div>

        <div class="slds-p-around_medium">
            <lightning-datatable key-field="Id" data={data} columns={columns} onrowaction={handleDelete} hide-checkbox-column></lightning-datatable>
        </div>
    </lightning-card>
</template>
