<template>
    <lightning-card title="Edit Form">
        <lightning-record-edit-form object-api-name={objectApiName} record-id={recordId} onsuccess={handleSubmit} onerror={handleError}>
         <lightning-input-field field-name="Name"></lightning-input-field>
         <lightning-input-field field-name="Phone"></lightning-input-field>
         <lightning-input-field field-name="Industry"></lightning-input-field>
         <lightning-input-field field-name="Website"></lightning-input-field>
         <lightning-input-field field-name="Rating"></lightning-input-field>
         <lightning-input-field field-name="AccountId"></lightning-input-field>
         <lightning-button variant="brand" label="Save" type="submit" ></lightning-button>
        </lightning-record-edit-form>
    </lightning-card>
    
</template>
